name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Nix files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz

      - name: Check Nix formatting
        run: nix-shell -p nixfmt --run 'nixfmt --check $(git ls-files -- "*.nix")'

  build:
    name: Build Nix files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz

      - name: Build Nix files
        run: |
          while IFS= read -r file; do
            nix-build --no-out-link -E "with import <nixpkgs> {}; callPackage ./$file {}"
          done < <(git ls-files -- "*.nix")
