# Portable Codex settings shared by the Gallatin hosts.
# Merge this fragment into each host's ~/.codex/config.toml. Keep project,
# notification, desktop, plugin, and local executable settings host-specific.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
model = "gpt-6-luna"
model_reasoning_effort = "xhigh"
personality = "pragmatic"

[features]
unified_exec = true
shell_snapshot = true
steer = true
multi_agent = true
exec_policy = true
remote_compaction = true
remote_models = true
memories = true
js_repl = false

[notice]
hide_full_access_warning = true

[memories]
generate_memories = true
use_memories = true
