name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Nix files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz

      - name: Check Nix formatting
        run: nix-shell -p nixfmt --run 'nixfmt --check $(git ls-files -- "*.nix")'

      - name: Parse Nix files
        run: |
          while IFS= read -r file; do
            nix-instantiate --parse "$file" >/dev/null
          done < <(git ls-files -- "*.nix")

      - name: Check runner flake
        working-directory: runners
        run: nix flake check --no-build --all-systems

  build:
    name: Build Nix files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz

      - name: Build Nix files
        run: |
          for file in codex.nix rename-picture.nix runners/github-actions-runner.nix; do
            nix-build --no-out-link -E "with import <nixpkgs> {}; callPackage ./$file {}"
          done
